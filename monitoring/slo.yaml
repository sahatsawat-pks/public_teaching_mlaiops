# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Freeze non-critical model deployments, route traffic to the previous known-good
      stable release container, and page the on-call SRE via alert webhook.

  - name: latency
    target_p95_ms: 150
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Scale endpoint minimum replica count from 1 to 2 instances, enable in-memory
      response caching for high-frequency batch requests, and profile slow scoring calls.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Trigger automated managed retraining pipeline on Vertex AI. If the candidate
      model fails the evaluation gate 3 consecutive times, escalate to platform owner.
